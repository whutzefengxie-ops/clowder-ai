name: Desktop macOS Probe

# ─────────────────────────────────────────────────────────────────────────────
# VERIFICATION HARNESS ONLY — not part of the product release pipeline.
#
# Exercises the macOS dual-arch fix on branch `feat/desktop-install-hardening`
# (see env.TARGET_REF) against a real macOS host:
#
#   Probe 1: default build on an arm64 host must package the HOST arch only and
#            pass the new architecture guard.
#   Probe 2: `--arch both` on an arm64 host must now FAIL CLOSED, naming the two
#            modules that previously shipped silently in the x64 DMG
#            (better_sqlite3.node, vec0.dylib). Before the fix this build
#            succeeded and produced a broken x64 installer.
#
# Triggered by pushing to this branch. Delete the branch when done.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - ci/desktop-mac-probe
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF: feat/desktop-install-hardening
  PROBE_VERSION: 0.0.0-probe

jobs:
  probe-host-default:
    name: Probe 1 - host-arch default passes the guard
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Host facts
        run: |
          echo "host arch : $(uname -m)"
          echo "ref       : ${{ env.TARGET_REF }}"
          echo "head      : $(git rev-parse --short HEAD)"

      - name: Unit tests (arch guard decision logic)
        run: node --test desktop/scripts/lib/mac-native-arch.test.mjs

      - name: Build with the DEFAULT arch set (no --arch flag)
        env:
          CATCAFE_VERSION: ${{ env.PROBE_VERSION }}
        run: |
          chmod +x desktop/scripts/build-mac.sh
          ./desktop/scripts/build-mac.sh 2>&1 | tail -45

      - name: Assert a single host-arch DMG was produced and the guard passed
        run: |
          set -e
          echo "--- dist ---"; ls -la dist/
          count="$(ls dist/*.dmg 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "FAIL: expected exactly 1 DMG for a host-arch default build, got $count"
            exit 1
          fi
          if ! ls dist/*arm64*.dmg >/dev/null 2>&1; then
            echo "FAIL: the host-arch DMG is not the expected arm64 artifact"
            exit 1
          fi
          if ls dist/*x64*.dmg >/dev/null 2>&1; then
            echo "FAIL: a foreign-arch DMG was produced by a host-arch default build"
            exit 1
          fi
          echo "OK: host-arch default produced exactly one arm64 DMG"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe1-host-default-dmg
          path: dist/*.dmg
          if-no-files-found: warn

  probe-dual-arch-must-fail:
    name: Probe 2 - dual arch must fail closed
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Build BOTH archs on one host (the guard must reject this)
        run: |
          set +e
          chmod +x desktop/scripts/build-mac.sh
          ./desktop/scripts/build-mac.sh --arch both > /tmp/dual.log 2>&1
          CODE=$?
          echo "build-mac.sh exit code: $CODE"
          echo "==================== tail of build output ===================="
          tail -60 /tmp/dual.log
          echo "==================== guard verdict ===================="
          if [ "$CODE" -eq 0 ]; then
            echo "FAIL: the dual-arch build SUCCEEDED — the guard did not fire"
            exit 1
          fi
          grep -q "architecture check failed for x64" /tmp/dual.log \
            || { echo "FAIL: guard did not report an x64 architecture failure"; exit 1; }
          grep -q "better_sqlite3.node" /tmp/dual.log \
            || { echo "FAIL: better-sqlite3 was not named as an offender"; exit 1; }
          grep -q "vec0.dylib" /tmp/dual.log \
            || { echo "FAIL: sqlite-vec was not named as an offender"; exit 1; }
          grep -q "refusing to package a DMG" /tmp/dual.log \
            || { echo "FAIL: the build did not fail closed"; exit 1; }
          if ls dist/*x64*.dmg >/dev/null 2>&1; then
            echo "FAIL: a broken x64 DMG was produced despite the guard"
            exit 1
          fi
          echo "OK: guard detected the host-arch leak and refused to package the x64 DMG"
          exit 0
